services:
  # SERVICE 1: QueryPilot Frontend (Static Site)
  - type: static
    name: querypilot-frontend
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false

  # SERVICE 2: QueryPilot Backend (Web Service)
  - type: web
    name: querypilot-backend
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_ADMIN_DB_URL
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
